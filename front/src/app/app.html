<header>
  <h1 class="title">Youtube to MP3 Converter</h1>
  <p class="under-title">Paste the Youtube link to download the audio</p>
</header>

<form (ngSubmit)="convertURL()" class="input-container">
  <input type="url" 
         placeholder="Paste the Youtube url here..." 
         required
         name="youtubeUrl"
         [(ngModel)]="youtubeUrl">
  <button [disabled]="!youtubeUrl.trim()"
          type="submit"
  >Convert to MP3</button>
</form>
